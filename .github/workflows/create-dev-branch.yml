name: Create dev branch from pre-revert main

on:
  push:
    branches:
      - main

jobs:
  create-dev-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check if dev branch exists and create if not
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const devSha = '710b152bf8b46333ebb7fcb419af6c73c15328fe';

            // Check if dev branch already exists
            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: 'heads/dev',
              });
              console.log('dev branch already exists, skipping creation.');
            } catch (e) {
              if (e.status === 404) {
                // Create the dev branch from the pre-revert main commit
                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: 'refs/heads/dev',
                  sha: devSha,
                });
                console.log(`dev branch created at ${devSha}`);
              } else {
                throw e;
              }
            }
