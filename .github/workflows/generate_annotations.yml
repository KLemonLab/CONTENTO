name: Generate test annotation .rds files
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'

      - name: Install required R packages
        run: |
          Rscript -e 'install.packages(c("readr", "dplyr"), repos = "https://cloud.r-project.org")'

      - name: Generate .rds annotation files
        run: |
          Rscript inst/extdata/test_annotations/generate_annotations.R

      - name: Commit generated .rds files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inst/extdata/test_annotations/rds || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Generate annotation .rds via workflow"
            git push origin HEAD:JEY_branch
          fi
